<head>

    <symbol id="i-game-template" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="6" x2="10" y1="11" y2="11" /><line x1="8" x2="8" y1="9" y2="13" /><line x1="15" x2="15.01" y1="12" y2="12" /><line x1="18" x2="18.01" y1="10" y2="10" /><path d="M17.32 5H6.68a4 4 0 0 0-3.978 3.59c-.006.052-.01.101-.017.152C2.604 9.416 2 14.456 2 16a3 3 0 0 0 3 3c1 0 1.5-.5 2-1l1.414-1.414A2 2 0 0 1 9.828 16h4.344a2 2 0 0 1 1.414.586L17 18c.5.5 1 1 2 1a3 3 0 0 0 3-3c0-1.545-.604-6.584-.685-7.258-.007-.05-.011-.1-.017-.151A4 4 0 0 0 17.32 5z" /></symbol>

    <symbol id="i-tutorials-examples" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.42 10.922a1 1 0 0 0-.019-1.838L12.83 5.18a2 2 0 0 0-1.66 0L2.6 9.08a1 1 0 0 0 0 1.832l8.57 3.908a2 2 0 0 0 1.66 0z" /><path d="M22 10v6" /><path d="M6 12.5V16a6 3 0 0 0 12 0v-3.5" /></symbol>

    <symbol id="s-busy" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-6.219-8.56" /></symbol>
    <symbol id="s-paused" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="14" y="3" width="5" height="18" rx="1" /><rect x="5" y="3" width="5" height="18" rx="1" /></symbol>
    <symbol id="s-finished" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10" /><path d="m16 9-5.5 5.5L8 12" /></symbol>
    <symbol id="s-stopped" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10" /><path d="m15 9-6 6" /><path d="m9 9 6 6" /></symbol>
    <symbol id="s-reset" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" /><path d="M3 3v5h5" /></symbol>
  </svg>

  <header class="header">
    <h1 class="title"><img class="logo" src="icons/logo.svg" alt="" width="21" height="21">Fab Free Claimer</h1>
    <span id="phase" class="phase tip" data-tip="Idle" aria-label="Idle"><svg class="phase-icon"><use id="phaseIcon" href="#s-idle"/></svg></span>
  </header>

  <form id="filters">
    <section class="section">
      <label class="label" for="query">Search <small>(optional)</small></label>
      <input id="query" class="input" type="text" autocomplete="off">
      <label class="check tip" data-tip="Only listings sold by Quixel Megascans. Exact seller match, not a text search.">
        <input id="quixelOnly" class="checkbox" type="checkbox" checked>
        <span>Quixel Megascans only</span>
      </label>
    </section>

    <section class="section">
      <div class="group-head">
        <span class="label">Types</span>
        <span class="group-actions">
          <button type="button" class="link" data-group="listingTypes" data-select="all">All</button>
          <button type="button" class="link" data-group="listingTypes" data-select="none">None</button>
        </span>
      </div>
      <div class="chips">
        <label class="chip"><input type="checkbox" name="listingTypes" value="3d-model" checked><svg><use href="#i-3d-model"/></svg><span>3D model</span></label>
        <label class="chip"><input type="checkbox" name="listingTypes" value="material"><svg><use href="#i-material"/></svg><span>Material</span></label>
        <label class="chip"><input type="checkbox" name="listingTypes" value="hdri"><svg><use href="#i-hdri"/></svg><span>HDRI</span></label>
        <label class="chip"><input type="checkbox" name="listingTypes" value="decal"><svg><use href="#i-decal"/></svg><span>Decal</span></label>
        <label class="chip"><input type="checkbox" name="listingTypes" value="brush"><svg><use href="#i-brush"/></svg><span>Brush</span></label>
        <label class="chip"><input type="checkbox" name="listingTypes" value="animation"><svg><use href="#i-animation"/></svg><span>Animation</span></label>
        <label class="chip"><input type="checkbox" name="listingTypes" value="vfx"><svg><use href="#i-vfx"/></svg><span>VFX</span></label>
        <label class="chip"><input type="checkbox" name="listingTypes" value="audio"><svg><use href="#i-audio"/></svg><span>Audio</span></label>
        <label class="chip"><input type="checkbox" name="listingTypes" value="ui"><svg><use href="#i-ui"/></svg><span>UI</span></label>
        <label class="chip"><input type="checkbox" name="listingTypes" value="game-template"><svg><use href="#i-game-template"/></svg><span>Game template</span></label>
        <label class="chip"><input type="checkbox" name="listingTypes" value="game-system"><svg><use href="#i-game-system"/></svg><span>Game system</span></label>
        <label class="chip"><input type="checkbox" name="listingTypes" value="tool-and-plugin"><svg><use href="#i-tool-and-plugin"/></svg><span>Tool and plugin</span></label>
        <label class="chip"><input type="checkbox" name="listingTypes" value="tutorials-examples"><svg><use href="#i-tutorials-examples"/></svg><span>Tutorials</span></label>
      </div>
    </section>

    <section class="section">
      <div class="group-head">
        <span class="label">Engines</span>
        <span class="group-actions">
          <button type="button" class="link" data-group="channels" data-select="all">All</button>
          <button type="button" class="link" data-group="channels" data-select="none">None</button>
        </span>
      </div>
      <div class="chips">
        <label class="chip"><input type="checkbox" name="channels" value="unreal-engine"><span>Unreal Engine</span></label>
        <label class="chip"><input type="checkbox" name="channels" value="unity"><span>Unity</span></label>
        <label class="chip"><input type="checkbox" name="channels" value="uefn"><span>UEFN</span></label>
      </div>
    </section>

    <section class="section">
      <div class="grid-2">
        <div>
          <span class="label tip" data-tip="Skip listings with an average rating below this. Click the same star again to clear.">Min stars</span>
          <div id="stars" class="stars" role="radiogroup" aria-label="Minimum stars">
            <button type="button" class="star" data-value="1" aria-label="1 star">&#9733;</button>
            <button type="button" class="star" data-value="2" aria-label="2 stars">&#9733;</button>
            <button type="button" class="star" data-value="3" aria-label="3 stars">&#9733;</button>
            <button type="button" class="star" data-value="4" aria-label="4 stars">&#9733;</button>
            <button type="button" class="star" data-value="5" aria-label="5 stars">&#9733;</button>
          </div>
          <input id="minRating" type="hidden" value="0">
        </div>
        <div>
          <label class="label tip" for="minRatingCount" data-tip="Skip listings with fewer ratings than this. Higher means only popular items.">Min ratings</label>
          <input id="minRatingCount" class="input" type="number" min="0" step="1" value="0">
        </div>
      </div>
      <label class="check tip" data-tip="Skip listings Fab marks as mature.">
        <input id="hideMature" class="checkbox" type="checkbox" checked>
        <span>Hide mature content</span>
      </label>
    </section>

    <section class="section">
      <label class="check">
        <input id="advanced" class="checkbox" type="checkbox">
        <span>Advanced</span>
      </label>
      <div id="advancedSection" class="advanced" hidden>
        <span class="label tip" data-tip="Random wait between two adds, in seconds. Slower is safer for your account.">Wait</span>
        <div class="grid-2">
          <label class="field">Min seconds
            <span class="input-wrap"><input id="paceMinSec" class="input" type="number" min="1" step="0.5" value="2"><button type="button" class="reset-field" data-target="paceMinSec" aria-label="Reset to default"><svg><use href="#s-reset"/></svg></button></span>
          </label>
          <label class="field">Max seconds
            <span class="input-wrap"><input id="paceMaxSec" class="input" type="number" min="1" step="0.5" value="4"><button type="button" class="reset-field" data-target="paceMaxSec" aria-label="Reset to default"><svg><use href="#s-reset"/></svg></button></span>
          </label>
        </div>
        <span class="label tip" data-tip="How many search pages of 24 listings to collect before adding them. Smaller starts adding sooner.">Batch</span>
        <div class="grid-2">
          <label class="field">Pages per batch
            <span class="input-wrap"><input id="batchPages" class="input" type="number" min="1" max="100" step="1" value="20"><button type="button" class="reset-field" data-target="batchPages" aria-label="Reset to default"><svg><use href="#s-reset"/></svg></button></span>
          </label>
          <label class="field">Pages fetched at once
            <span class="input-wrap"><input id="parallelPages" class="input" type="number" min="1" max="8" step="1" value="4"><button type="button" class="reset-field" data-target="parallelPages" aria-label="Reset to default"><svg><use href="#s-reset"/></svg></button></span>
          </label>
        </div>
        <label class="field tip" data-tip="How many ownership checks run at the same time. Higher is faster, more load on Fab.">Ownership checks at once
          <span class="input-wrap"><input id="parallelChecks" class="input" type="number" min="1" max="16" step="1" value="8"><button type="button" class="reset-field" data-target="parallelChecks" aria-label="Reset to default"><svg><use href="#s-reset"/></svg></button></span>
        </label>
      </div>
    </section>

    <div class="actions">
      <button id="start" type="submit" class="button button-start">Start</button>
      <button id="pauseResume" type="button" class="button button-pause" disabled>Pause</button>
      <button id="stop" type="button" class="button button-stop" disabled>Stop</button>
      <button id="reset" type="button" class="button button-ghost" title="Forget which listings were already done">Reset</button>
    </div>
  </form>

  <section class="section">
    <div class="progress"><div id="barFill" class="progress-indicator"></div></div>
    <p id="status" class="status">Ready</p>
    <p class="stats">
      <span class="stat-added"><b id="countAdded">0</b> added</span>
      <span class="stat-owned"><b id="countOwned">0</b> owned</span>
      <span class="stat-skipped"><b id="countSkipped">0</b> skipped</span>
      <span class="stat-failed"><b id="countFailed">0</b> failed</span>
    </p>
    <pre id="log" class="log"></pre>
  </section>

  <div id="tooltip" class="tooltip" hidden></div>

  <script src="popup.js"></script>
</body>
</html>
