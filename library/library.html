  <header class="topbar">
    <h1 class="title"><img class="logo" src="icons/logo.svg" alt="" width="21" height="21">Fab Owned Library</h1>
    <div class="panel">
      <label class="search">
        <svg><use href="#s-search"/></svg>
        <input id="search" class="input" type="search" placeholder="Search library" autocomplete="off">
      </label>
      <span id="phase" class="phase tip" data-tip="Idle" aria-label="Idle"><svg class="phase-icon"><use id="phaseIcon" href="#s-idle"/></svg></span>
      <div class="actions">
        <button id="sync" type="button" class="button button-start"><svg><use href="#s-sync"/></svg>Sync</button>
        <button id="pauseResume" type="button" class="button button-pause" disabled><svg><use href="#s-paused"/></svg>Pause</button>
        <button id="stop" type="button" class="button button-stop" disabled><svg><use href="#s-stop"/></svg>Stop</button>
        <button id="export" type="button" class="button button-outline" disabled><svg><use href="#s-download"/></svg><span id="exportLabel">Export</span></button>
        <button id="advanced" type="button" class="button button-outline" aria-pressed="false"><svg><use href="#s-advanced"/></svg>Advanced</button>
        <button id="logToggle" type="button" class="button button-outline" aria-pressed="false"><svg><use href="#s-log"/></svg>Log</button>
      </div>
    </div>
  </header>


  <div class="layout">
    <aside id="sidebar" class="sidebar">
      <div class="resizer" data-target="sidebar" data-side="right" title="Drag to resize"></div>
      <section class="facet">
        <div class="group-head">
          <span class="label">Types</span>
          <span class="group-actions">
            <button type="button" class="link" data-facet="types" data-select="none">Clear</button>
          </span>
        </div>
        <div id="typeFacet" class="chips"></div>
      </section>

      <section class="facet">
        <div class="group-head">
          <span class="label">Status</span>
        </div>
        <div class="chips">
          <label class="chip"><input type="radio" name="status" value="ok" checked><span>In library</span></label>
          <label class="chip"><input type="radio" name="status" value="gone"><span>Gone</span></label>
          <label class="chip"><input type="radio" name="status" value="all"><span>All</span></label>
        </div>
        <label class="check">
          <input id="hideMature" class="checkbox" type="checkbox" checked>
          <span>Hide mature content</span>
        </label>
      </section>

      <section class="facet">
        <div class="group-head">
          <span class="label">Sellers</span>
          <span class="group-actions">
            <button type="button" class="link" data-facet="sellers" data-select="none">Clear</button>
          </span>
        </div>
        <div id="sellerFacet" class="list"></div>
      </section>

      <section class="facet">
        <div class="group-head">
          <span class="label">Tags</span>
          <span class="group-actions">
            <button type="button" class="link" data-facet="tags" data-select="none">Clear</button>
          </span>
        </div>
        <input id="tagSearch" class="input input-small" type="search" placeholder="Find tag" autocomplete="off">
        <div id="tagFacet" class="chips"></div>
      </section>

      <section class="facet">
        <span class="label">Sort</span>
        <div class="chips">
          <label class="chip"><input type="radio" name="sort" value="acquired" checked><span>Newest</span></label>
          <label class="chip"><input type="radio" name="sort" value="title"><span>Title</span></label>
          <label class="chip"><input type="radio" name="sort" value="type"><span>Type</span></label>
        </div>
      </section>
    </aside>

    <main class="main">
    <div id="advancedBar" class="advanced-bar" hidden>
        <div class="field">
          <span class="field-label tip" data-tip="Fetch details again for every item, not only new ones.">Sync</span>
          <label class="check control"><input id="fullResync" class="checkbox" type="checkbox"><span>Full resync</span></label>
        </div>
        <div class="field">
          <span class="field-label tip" data-tip="Listing details fetched at the same time. Higher is faster, more load on Fab.">Details at once</span>
          <span class="input-wrap"><input id="detailsAtOnce" class="input" type="number" min="1" max="8" step="1" value="4"><button type="button" class="reset-field" data-target="detailsAtOnce" aria-label="Reset to default"><svg><use href="#s-reset"/></svg></button></span>
        </div>
        <div class="field">
          <span class="field-label tip" data-tip="Wait after each group of details, in milliseconds.">Wait ms</span>
          <span class="input-wrap"><input id="waitMs" class="input" type="number" min="0" max="10000" step="50" value="300"><button type="button" class="reset-field" data-target="waitMs" aria-label="Reset to default"><svg><use href="#s-reset"/></svg></button></span>
        </div>
        <div class="field">
          <span class="field-label tip" data-tip="Add the untouched Fab library record to each exported item.">Export</span>
          <label class="check control"><input id="includeRaw" class="checkbox" type="checkbox"><span>Include raw data</span></label>
        </div>
        <div class="field grow">
          <span class="field-label">Catalog</span>
          <div class="control-row">
            <button id="diagnostics" type="button" class="button button-outline tip" data-tip="Copies counts, settings, the log, and one raw library record. Paste it when reporting a problem."><svg><use href="#s-diagnostics"/></svg>Copy diagnostics</button>
            <button id="clear" type="button" class="button button-outline danger tip" data-tip="Deletes the local catalog only. Your Fab library is not touched. Sync again to rebuild."><svg><use href="#s-trash"/></svg>Reset catalog</button>
          </div>
        </div>
      </div>

    <div class="progress-row">
      <div class="progress"><div id="barFill" class="progress-indicator"></div></div>
      <p id="status" class="status">No items yet. Log in to fab.com, then press Sync.</p>
    </div>
    <pre id="log" class="log" hidden></pre>
      <p id="count" class="count"></p>
      <div id="grid" class="grid"></div>
      <button id="more" type="button" class="button button-outline more" hidden>Show more</button>
    </main>
  </div>

  <aside id="drawer" class="drawer" hidden>
    <div class="resizer" data-target="drawer" data-side="left" title="Drag to resize"></div>
    <div class="drawer-head">
      <h2 id="drawerTitle" class="drawer-title"></h2>
      <button id="drawerClose" type="button" class="icon-button" aria-label="Close"><svg><use href="#s-close"/></svg></button>
    </div>
    <div class="drawer-body">
      <div class="hero"><img id="drawerImage" alt=""></div>
      <div id="drawerGallery" class="gallery"></div>
      <dl id="drawerFacts" class="facts"></dl>
      <div id="drawerTags" class="chips"></div>
      <p id="drawerDescription" class="description"></p>
    </div>
    <div class="drawer-actions">
      <a id="drawerOpen" class="button button-outline" target="_blank" rel="noopener"><svg><use href="#s-external"/></svg>Open on Fab</a>
      <button id="drawerRecheck" type="button" class="button button-outline"><svg><use href="#s-sync"/></svg>Recheck</button>
      <button id="drawerCopy" type="button" class="button button-ghost"><svg><use href="#s-copy"/></svg>Copy JSON</button>
    </div>
  </aside>

  <div id="tooltip" class="tooltip" hidden></div>

  <script src="library.js"></script>
</body>
</html>
